
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-analyst"
version = "0.1.0"
description = "Agente de IA que responde perguntas de negocio em linguagem natural sobre dados de delivery (SQL + graficos + explicacao)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sqlglot>=26.0",
    "google-genai>=2.34.0",
    "openai>=2.0.0",
    "anthropic>=0.75.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
