name: CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ========================================================
  # BACKEND PYTHON
  # ========================================================

  backend:
    name: Backend Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ----------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      # ----------------------------------------------------
      # GENERATE SYNTHETIC DATABASE
      # ----------------------------------------------------

      - name: Generate synthetic delivery database
        run: |
          python - <<'PY'
          from pathlib import Path

          import duckdb

          from ai_analyst.data.generate import generate_tables


          DATABASE_PATH = Path("data/delivery.duckdb")

          EXPECTED_COUNTS = {
              "restaurants": 200,
              "customers": 5_000,
              "couriers": 300,
              "orders": 60_000,
          }

          # Ensure the database directory exists.
          DATABASE_PATH.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          # Generate deterministic synthetic data.
          tables = generate_tables(
              seed=42,
              n_orders=60_000,
          )

          # Validate the generated table collection.
          if set(tables) != set(EXPECTED_COUNTS):
              raise RuntimeError(
                  "Unexpected database tables: "
                  f"{sorted(tables)}"
              )

          # Persist DataFrames into DuckDB.
          with duckdb.connect(
              str(DATABASE_PATH)
          ) as connection:

              for table_name, dataframe in tables.items():

                  expected_count = EXPECTED_COUNTS[table_name]
                  generated_count = len(dataframe)

                  if generated_count != expected_count:
                      raise RuntimeError(
                          f"Invalid row count for {table_name}: "
                          f"expected={expected_count}, "
                          f"actual={generated_count}"
                      )

                  connection.register(
                      "_generated_dataframe",
                      dataframe,
                  )

                  connection.execute(
                      f'''
                      CREATE OR REPLACE TABLE "{table_name}"
                      AS SELECT * FROM _generated_dataframe
                      '''
                  )

                  connection.unregister(
                      "_generated_dataframe"
                  )

                  actual_count = connection.execute(
                      f'SELECT COUNT(*) FROM "{table_name}"'
                  ).fetchone()[0]

                  if actual_count != expected_count:
                      raise RuntimeError(
                          f"Database validation failed for {table_name}: "
                          f"expected={expected_count}, "
                          f"actual={actual_count}"
                      )

                  print(
                      f"[OK] {table_name}: "
                      f"{actual_count:,} records"
                  )

          print(
              f"\nDatabase successfully generated: "
              f"{DATABASE_PATH}"
          )

          print(
              f"Database size: "
              f"{DATABASE_PATH.stat().st_size:,} bytes"
          )
          PY

      # ----------------------------------------------------
      # CODE QUALITY
      # ----------------------------------------------------

      - name: Run Ruff lint
        run: |
          ruff check src tests

      - name: Check Python formatting
        run: |
          ruff format --check src tests

      # ----------------------------------------------------
      # EVALUATION DATASET
      # ----------------------------------------------------

      - name: Validate evaluation dataset and reference SQL
        run: |
          ai-evaluation --validate-only

      # ----------------------------------------------------
      # AUTOMATED TESTS
      # ----------------------------------------------------

      - name: Run Python test suite
        run: |
          python -m pytest -q


  # ========================================================
  # FRONTEND NEXT.JS
  # ========================================================

  frontend:
    name: Frontend Quality Checks

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ----------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------

      - name: Install frontend dependencies
        run: |
          npm ci

      # ----------------------------------------------------
      # FRONTEND TESTS
      # ----------------------------------------------------

      - name: Run frontend tests
        run: |
          npm test

      # ----------------------------------------------------
      # CODE QUALITY
      # ----------------------------------------------------

      - name: Run ESLint
        run: |
          npm run lint

      # ----------------------------------------------------
      # NEXT.JS TYPES
      # ----------------------------------------------------

      - name: Generate Next.js route types
        run: |
          npx next typegen

      - name: Check TypeScript types
        run: |
          npx tsc --noEmit

      # ----------------------------------------------------
      # PRODUCTION BUILD
      # ----------------------------------------------------

      - name: Build Next.js application
        run: |
          npm run build