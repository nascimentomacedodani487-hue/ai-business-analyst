
name: CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ========================================================
  # BACKEND PYTHON
  # ========================================================

  backend:
    name: Backend Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ----------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      # ----------------------------------------------------
      # CODE QUALITY
      # ----------------------------------------------------

      - name: Run Ruff lint
        run: |
          ruff check src tests

      - name: Check Python formatting
        run: |
          ruff format --check src tests

      # ----------------------------------------------------
      # EVALUATION DATASET
      # ----------------------------------------------------

      - name: Validate evaluation dataset and reference SQL
        run: |
          ai-evaluation --validate-only

      # ----------------------------------------------------
      # AUTOMATED TESTS
      # ----------------------------------------------------

      - name: Run Python test suite
        run: |
          python -m pytest -q

  # ========================================================
  # FRONTEND NEXT.JS
  # ========================================================

  frontend:
    name: Frontend Quality Checks

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ----------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------

      - name: Install frontend dependencies
        run: |
          npm ci

      # ----------------------------------------------------
      # FRONTEND TESTS
      # ----------------------------------------------------

      - name: Run frontend tests
        run: |
          npm test

      # ----------------------------------------------------
      # CODE QUALITY
      # ----------------------------------------------------

      - name: Run ESLint
        run: |
          npm run lint

      # ----------------------------------------------------
      # NEXT.JS TYPES
      # ----------------------------------------------------

      - name: Generate Next.js route types
        run: |
          npx next typegen

      - name: Check TypeScript types
        run: |
          npx tsc --noEmit

      # ----------------------------------------------------
      # PRODUCTION BUILD
      # ----------------------------------------------------

      - name: Build Next.js application
        run: |
          npm run build
